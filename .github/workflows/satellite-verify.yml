# Job harian verifikasi satelit (PRD §6.2, FR-4.4/4.5).
#
# Worker-nya sudah lengkap sejak lama tetapi TIDAK PERNAH TERJADWAL, sehingga
# `verification_status` tiap batch hanya berubah kalau ada yang menjalankannya
# manual. Itu melubangi klaim inti produk ini — "kami tidak percaya klaim petani,
# kami memverifikasinya" — karena verifikasinya tidak berjalan sendiri.
#
# Dijadwalkan di sini, bukan sebagai cron Render, karena Cron Job di Render adalah
# layanan berbayar sedangkan worker ini cuma perlu jalan sekali sehari selama
# beberapa menit.
#
# Citra diambil dari Earth Search (AWS Open Data) — Sentinel-2 L2A resmi ESA dalam
# format COG, TANPA kredensial. Satu-satunya rahasia yang dibutuhkan adalah
# koneksi basis data.
name: satellite-verify

on:
  schedule:
    # 19:00 UTC = 02:00 WIB. Sengaja lewat tengah malam waktu Indonesia: scene
    # Sentinel-2 hari itu sudah terbit, dan tidak ada Tenant yang sedang mencatat
    # kegiatan sehingga tidak bersaing memperebutkan koneksi basis data.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      synthetic:
        description: "Pakai citra tiruan (hanya untuk menguji pipeline)"
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Pembacaan COG didominasi latensi jaringan. Satu batch bisa beberapa menit,
    # jadi beri ruang — tetapi tetap berbatas supaya tidak menggantung berjam-jam.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/satellite-worker/requirements.txt

      - name: Pasang dependensi
        working-directory: apps/satellite-worker
        run: pip install -r requirements.txt

      - name: Uji aturan keputusan
        working-directory: apps/satellite-worker
        # Dijalankan SEBELUM menyentuh basis data. Aturan fenologi inilah yang
        # menentukan sebuah batch terverifikasi atau tidak; kalau logikanya rusak,
        # lebih baik job gagal daripada menulis status yang salah ke produksi.
        run: pytest -q

      - name: Verifikasi batch aktif
        working-directory: apps/satellite-worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNTHETIC_SCENES: ${{ inputs.synthetic && '1' || '0' }}
          DIPICU: ${{ github.event_name }}
        run: |
          # Tanpa secret, perlakuannya BERBEDA menurut siapa yang memicu.
          #
          # Terjadwal: lewati dan tetap hijau. Secret ini sengaja belum disetel,
          # jadi gagal tiap malam hanya menghasilkan tanda merah beruntun di tab
          # Actions dan email harian — kebisingan yang membuat kegagalan SUNGGUHAN
          # nanti tidak lagi terlihat, dan membuat repo tampak rusak bagi siapa pun
          # yang membukanya.
          #
          # Manual: gagalkan dengan lantang. Orang yang menekan tombol jelas ingin
          # job ini benar-benar berjalan, jadi diam-diam melewatinya justru menipu.
          if [ -z "$DATABASE_URL" ]; then
            if [ "$DIPICU" = "schedule" ]; then
              echo "::notice::Dilewati — secret DATABASE_URL belum disetel, jadi verifikasi satelit belum aktif."
              echo "Setel di Settings → Secrets and variables → Actions untuk mengaktifkannya."
              exit 0
            fi
            echo "::error::Secret DATABASE_URL belum disetel (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python -m src.main
